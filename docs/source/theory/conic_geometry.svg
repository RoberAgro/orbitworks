<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="sans-serif">
  <rect x="0" y="0" width="920" height="560" fill="#ffffff" stroke="#d0d0d0"/>

  <!-- ================= ELLIPSE PANEL ================= -->
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Ellipse (0 ≤ e &lt; 1)</text>

  <!-- axes -->
  <line x1="60" y1="210" x2="340" y2="210" stroke="#999999" stroke-dasharray="4,3"/>
  <line x1="200" y1="94" x2="200" y2="326" stroke="#999999" stroke-dasharray="4,3"/>

  <!-- directrix -->
  <line x1="400" y1="90" x2="400" y2="330" stroke="#b08968" stroke-dasharray="6,4"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" fill="#8a5a34">directrix</text>

  <!-- ellipse curve -->
  <polygon points="320.00,210.00 319.54,201.63 318.18,193.33 315.91,185.15 312.76,177.17 308.76,169.43 303.92,162.00 298.30,154.94 291.93,148.29 284.85,142.12 277.13,136.46 268.83,131.36 260.00,126.86 250.71,122.99 241.04,119.79 231.06,117.27 220.84,115.46 210.46,114.37 200.00,114.00 189.54,114.37 179.16,115.46 168.94,117.27 158.96,119.79 149.29,122.99 140.00,126.86 131.17,131.36 122.87,136.46 115.15,142.12 108.07,148.29 101.70,154.94 96.08,162.00 91.24,169.43 87.24,177.17 84.09,185.15 81.82,193.33 80.46,201.63 80.00,210.00 80.46,218.37 81.82,226.67 84.09,234.85 87.24,242.83 91.24,250.57 96.08,258.00 101.70,265.06 108.07,271.71 115.15,277.88 122.87,283.54 131.17,288.64 140.00,293.14 149.29,297.01 158.96,300.21 168.94,302.73 179.16,304.54 189.54,305.63 200.00,306.00 210.46,305.63 220.84,304.54 231.06,302.73 241.04,300.21 250.71,297.01 260.00,293.14 268.83,288.64 277.13,283.54 284.85,277.88 291.93,271.71 298.30,265.06 303.92,258.00 308.76,250.57 312.76,242.83 315.91,234.85 318.18,226.67 319.54,218.37"
    fill="none" stroke="#2b6cb0" stroke-width="2.4"/>

  <!-- triangle O - F2 - topMinor  (right angle at O) -->
  <polygon points="200,210 272,210 200,114" fill="#2b6cb0" fill-opacity="0.06" stroke="#333333" stroke-width="1.3"/>
  <polyline points="200,198 212,198 212,210" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- points -->
  <circle cx="200" cy="210" r="3.5" fill="#1a1a1a"/>
  <circle cx="128" cy="210" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <circle cx="272" cy="210" r="5.5" fill="#c0392b"/>
  <circle cx="320" cy="210" r="4" fill="#1a1a1a"/>
  <circle cx="80"  cy="210" r="4" fill="#1a1a1a"/>

  <!-- point labels -->
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#1a1a1a">O</text>
  <text x="128" y="230" text-anchor="middle" font-size="12" fill="#c0392b">F₁</text>
  <text x="128" y="244" text-anchor="middle" font-size="10" fill="#c0392b">(empty focus)</text>
  <text x="272" y="230" text-anchor="middle" font-size="12" fill="#c0392b">F₂</text>
  <text x="272" y="244" text-anchor="middle" font-size="10" fill="#c0392b">(central body)</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#1a1a1a">periapsis</text>
  <text x="80"  y="196" text-anchor="middle" font-size="11" fill="#1a1a1a">apoapsis</text>

  <!-- triangle leg labels -->
  <text x="236" y="226" text-anchor="middle" font-size="12" fill="#333333">c</text>
  <text x="180" y="163" text-anchor="middle" font-size="12" fill="#333333">b</text>
  <text x="252" y="158" text-anchor="middle" font-size="12" fill="#333333">a</text>

  <!-- r_p bracket -->
  <line x1="272" y1="339" x2="272" y2="345" stroke="#333333"/>
  <line x1="320" y1="339" x2="320" y2="345" stroke="#333333"/>
  <line x1="272" y1="345" x2="320" y2="345" stroke="#333333"/>
  <text x="296" y="360" text-anchor="middle" font-size="12" fill="#333333">r_p</text>

  <!-- r_a bracket -->
  <line x1="80"  y1="364" x2="80"  y2="370" stroke="#333333"/>
  <line x1="272" y1="364" x2="272" y2="370" stroke="#333333"/>
  <line x1="80"  y1="370" x2="272" y2="370" stroke="#333333"/>
  <text x="176" y="386" text-anchor="middle" font-size="12" fill="#333333">r_a</text>

  <!-- legend -->
  <text x="200" y="418" text-anchor="middle" font-size="12.5" fill="#1a1a1a">e = c / a &#160; (0 ≤ e &lt; 1)</text>
  <text x="200" y="438" text-anchor="middle" font-size="12.5" fill="#1a1a1a">c&#178; = a&#178; − b&#178;</text>
  <text x="200" y="458" text-anchor="middle" font-size="12.5" fill="#1a1a1a">r_p = a − c = a(1 − e)</text>
  <text x="200" y="478" text-anchor="middle" font-size="12.5" fill="#1a1a1a">r_a = a + c = a(1 + e)</text>

  <!-- ================= HYPERBOLA PANEL ================= -->
  <text x="680" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Hyperbola (e &gt; 1)</text>

  <!-- transverse axis -->
  <line x1="540" y1="230" x2="820" y2="230" stroke="#999999" stroke-dasharray="4,3"/>

  <!-- asymptotes -->
  <line x1="680" y1="230" x2="836" y2="22"  stroke="#999999" stroke-dasharray="6,4"/>
  <line x1="680" y1="230" x2="836" y2="438" stroke="#999999" stroke-dasharray="6,4"/>
  <text x="840" y="20" font-size="11" fill="#777777">slope = ±b/a</text>

  <!-- hyperbola branch curve -->
  <polyline points="828.80,403.63 819.41,389.17 810.81,375.62 802.96,362.90 795.80,350.92 789.29,339.64 783.41,328.97 778.11,318.86 773.37,309.26 769.16,300.11 765.45,291.35 762.22,282.94 759.47,274.84 757.16,266.98 755.29,259.34 753.84,251.86 752.82,244.50 752.20,237.23 752.00,230.00 752.20,222.77 752.82,215.50 753.84,208.14 755.29,200.66 757.16,193.02 759.47,185.16 762.22,177.06 765.45,168.65 769.16,159.89 773.37,150.74 778.11,141.14 783.41,131.03 789.29,120.36 795.80,109.08 802.96,97.10 810.81,84.38 819.41,70.83 828.80,56.37"
    fill="none" stroke="#c05621" stroke-width="2.4"/>

  <!-- triangle O - vertex - asymPt  (right angle at vertex) -->
  <polygon points="680,230 752,230 752,134" fill="#c05621" fill-opacity="0.06" stroke="#333333" stroke-width="1.3"/>
  <polyline points="740,230 740,218 752,218" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- points -->
  <circle cx="680" cy="230" r="3.5" fill="#1a1a1a"/>
  <circle cx="560" cy="230" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <circle cx="800" cy="230" r="5.5" fill="#c0392b"/>
  <circle cx="752" cy="230" r="4" fill="#1a1a1a"/>

  <!-- point labels -->
  <text x="680" y="250" text-anchor="middle" font-size="12" fill="#1a1a1a">O</text>
  <text x="560" y="250" text-anchor="middle" font-size="12" fill="#c0392b">F₁</text>
  <text x="560" y="264" text-anchor="middle" font-size="10" fill="#c0392b">(empty focus)</text>
  <text x="800" y="250" text-anchor="middle" font-size="12" fill="#c0392b">F₂</text>
  <text x="800" y="264" text-anchor="middle" font-size="10" fill="#c0392b">(central body)</text>
  <text x="752" y="214" text-anchor="middle" font-size="11" fill="#1a1a1a">periapsis</text>

  <!-- triangle leg labels -->
  <text x="716" y="248" text-anchor="middle" font-size="12" fill="#333333">a</text>
  <text x="768" y="184" text-anchor="middle" font-size="12" fill="#333333">b</text>
  <text x="700" y="172" text-anchor="middle" font-size="12" fill="#333333">c</text>

  <!-- r_p bracket -->
  <line x1="752" y1="339" x2="752" y2="345" stroke="#333333"/>
  <line x1="800" y1="339" x2="800" y2="345" stroke="#333333"/>
  <line x1="752" y1="345" x2="800" y2="345" stroke="#333333"/>
  <text x="776" y="360" text-anchor="middle" font-size="12" fill="#333333">r_p</text>

  <!-- legend -->
  <text x="680" y="418" text-anchor="middle" font-size="12.5" fill="#1a1a1a">e = c / a &#160; (e &gt; 1)</text>
  <text x="680" y="438" text-anchor="middle" font-size="12.5" fill="#1a1a1a">c&#178; = a&#178; + b&#178;</text>
  <text x="680" y="458" text-anchor="middle" font-size="12.5" fill="#1a1a1a">r_p = c − a = a(e − 1)</text>
  <text x="680" y="478" text-anchor="middle" font-size="12.5" fill="#1a1a1a">no apoapsis (orbit is unbound)</text>

  <!-- ================= SHARED CAPTION ================= -->
  <text x="460" y="520" text-anchor="middle" font-size="12.5" fill="#1a1a1a">
    Eccentricity e = (distance to focus) / (distance to directrix), the same ratio for every point on the curve.
  </text>
  <text x="460" y="540" text-anchor="middle" font-size="12.5" fill="#1a1a1a">
    e = 0: circle &#160;&#160;•&#160;&#160; 0 &lt; e &lt; 1: ellipse &#160;&#160;•&#160;&#160; e = 1: parabola &#160;&#160;•&#160;&#160; e &gt; 1: hyperbola
  </text>
</svg>
