[tool.poetry]
name = "orbitworks"
version = "0.1.0"
description = "Tinker with gravity, trajectories, and the mathematics of orbital motion."
authors = ["Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RoberAgro/orbitworks"
documentation = "https://github.com/RoberAgro/orbitworks"
packages = [{ include = "orbitworks", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
jax = "^0.10.2"
diffrax = "^0.7.2"
equinox = "^0.13.8"
matplotlib = "^3.11.1"
plotly = "^7.0.0"

[tool.poetry.group.dev.dependencies]
ipython = "^9.5.0"
black = "^26.3.1"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Remember to add --tags when publishing a new version:
# git push origin main --tags
