[tool.poetry]
name = "orbitworks"
version = "1.0.0"
description = "Tinker with gravity, trajectories, and the mathematics of orbital motion."
authors = ["Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RoberAgro/orbitworks"
documentation = "https://github.com/RoberAgro/orbitworks"
packages = [{ include = "orbitworks", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
jax = "^0.10.2"
diffrax = "^0.7.2"
equinox = "^0.13.8"
matplotlib = "^3.11.1"
plotly = "^7.0.0"
scipy = "^1.17.1"
dash = ">=3.1,<5"
gunicorn = "^26.2.0"

[tool.poetry.group.dev.dependencies]
ipython = "^9.5.0"
black = "^26.3.1"
pytest = "^8.3.5"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
bump2version = "^1.0.1"
myst-parser = "^3.0"
linkify-it-py = "^2.0"
sphinx-autobuild = "^2024.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Release from a clean main branch:
# poetry run bumpversion patch
# git push origin main --tags